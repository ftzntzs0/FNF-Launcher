name: Build and Release MSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, x86, ARM64]
        configuration: [Release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build MSIX for ${{ matrix.platform }}
        run: dotnet publish -c ${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} --no-restore

      - name: Decode and import certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          # Criar pasta temporária para o certificado
          $certPath = "C:\temp\certificate.pfx"
          New-Item -ItemType Directory -Path "C:\temp" -Force | Out-Null

          # Decodificar e salvar o certificado
          [System.Convert]::FromBase64String($env:CERTIFICATE_BASE64) | Set-Content -Path $certPath -AsByteStream

          # Importar o certificado no store pessoal
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation "Cert:\CurrentUser\My" -Password (ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force)
          echo "CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Limpar arquivo temporário
          Remove-Item -Path $certPath -Force

      - name: Sign MSIX packages
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          $msixPath = "bin\${{ matrix.configuration }}\net8.0-windows10.0.19041.0\${{ matrix.platform == 'ARM64' && 'win-arm64' || format('win-{0}', matrix.platform) }}\AppX\*.msix"
          $files = Get-Item -Path $msixPath -ErrorAction SilentlyContinue

          if ($files) {
            foreach ($file in $files) {
              Write-Host "Signing: $($file.FullName)"
              & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /fd SHA256 /f "C:\Users\${{ runner.os == 'Windows' && 'runner' || 'vsts' }}\AppData\Local\Temp\certificate.pfx" /p "$env:CERTIFICATE_PASSWORD" /t "http://timestamp.digicert.com" "$($file.FullName)"
            }
          }

      - name: Upload MSIX as artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.platform }}
          path: |
            bin/${{ matrix.configuration }}/net8.0-windows10.0.19041.0/*/AppX/*.msix
            bin/${{ matrix.configuration }}/net8.0-windows10.0.19041.0/*/AppX/*.msixbundle

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.msix
            artifacts/**/*.msixbundle
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: artifacts/**/*.msix
          asset_name: FNFVsliceLauncher-${{ matrix.platform }}.msix
          asset_content_type: application/octet-stream
