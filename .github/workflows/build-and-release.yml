name: Build and Release MSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      # Adicionada a flag GenerateAppxPackageOnBuild=true para GARANTIR a criação do MSIX
      - name: Build MSIX for x64
        run: dotnet publish -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:PublishReadyToRun=false -p:GenerateAppxPackageOnBuild=true --no-restore

      - name: Decode and import certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          # Criar pasta temporária para o certificado
          $certPath = "C:\temp\certificate.pfx"
          New-Item -ItemType Directory -Path "C:\temp" -Force | Out-Null

          # Decodificar e salvar o certificado
          [System.Convert]::FromBase64String($env:CERTIFICATE_BASE64) | Set-Content -Path $certPath -AsByteStream

          # Importar o certificado no store pessoal
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation "Cert:\CurrentUser\My" -Password (ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force)
          echo "CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Find, Sign and Prepare MSIX
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          # 1. Procura o arquivo .msix recursivamente, IGNORANDO a pasta "Dependencies"
          $msixFiles = Get-ChildItem -Path .\ -Recurse -Filter "*.msix" | Where-Object { $_.FullName -notmatch "\\Dependencies\\" }

          if ($msixFiles.Count -eq 0) {
            Write-Error "Nenhum arquivo .msix principal foi encontrado!"
            exit 1
          }

          # 2. Cria uma pasta centralizada
          New-Item -ItemType Directory -Path ".\MsixOutput" -Force | Out-Null

          # 3. Localiza dinamicamente a versão mais recente do signtool instalada
          $signToolPath = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          
          if (-not $signToolPath) {
             Write-Error "signtool.exe não encontrado no ambiente!"
             exit 1
          }

          # 4. Assina e copia os arquivos encontrados
          foreach ($file in $msixFiles) {
            Write-Host "========================================"
            Write-Host "Encontrado MSIX em: $($file.FullName)"
            Write-Host "Assinando..."
            
            & $signToolPath sign /fd SHA256 /f "C:\temp\certificate.pfx" /p "$env:CERTIFICATE_PASSWORD" /t "http://timestamp.digicert.com" "$($file.FullName)"
            
            # Verifica se o Signtool deu erro. Se deu, para o processo inteiro.
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Falha ao assinar o arquivo $($file.Name). Verifique se o Publisher no Package.appxmanifest bate com o Subject do certificado."
              exit 1
            }
            
            # Copia para a pasta de output limpa
            Copy-Item -Path $file.FullName -Destination ".\MsixOutput\"
            Write-Host "Movido para a pasta MsixOutput com sucesso."
            Write-Host "========================================"
          }

      - name: Upload MSIX as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnf-launcher-x64
          # Agora o upload pega o arquivo direto da pasta que criamos, sem erros de caminho!
          path: MsixOutput/*.msix