name: Build and Release MSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build MSIX for x64
        run: dotnet publish -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:PublishReadyToRun=false --no-restore

      - name: Decode and import certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          # Criar pasta temporária para o certificado
          $certPath = "C:\temp\certificate.pfx"
          New-Item -ItemType Directory -Path "C:\temp" -Force | Out-Null

          # Decodificar e salvar o certificado
          [System.Convert]::FromBase64String($env:CERTIFICATE_BASE64) | Set-Content -Path $certPath -AsByteStream

          # Importar o certificado no store pessoal
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation "Cert:\CurrentUser\My" -Password (ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force)
          echo "CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign MSIX packages
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          $msixPath = "bin\Release\net8.0-windows10.0.19041.0\win-x64\AppX\*.msix"
          $files = Get-Item -Path $msixPath -ErrorAction SilentlyContinue

          if ($files) {
            foreach ($file in $files) {
              Write-Host "Signing: $($file.FullName)"
              $signToolPath = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
              if (-not (Test-Path $signToolPath)) {
                # Fallback para versão padrão se a específica não existir
                $signToolPath = "signtool.exe"
              }
              & $signToolPath sign /fd SHA256 /f "C:\temp\certificate.pfx" /p "$env:CERTIFICATE_PASSWORD" /t "http://timestamp.digicert.com" "$($file.FullName)"
            }
          } else {
            Write-Host "Nenhum MSIX encontrado em: $msixPath"
            Get-ChildItem -Path "bin\Release\net8.0-windows10.0.19041.0\" -Recurse -Filter "*.msix" | ForEach-Object { Write-Host "Encontrado: $_" }
          }

      - name: Upload MSIX as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnf-launcher-x64
          path: bin/Release/net8.0-windows10.0.19041.0/win-x64/AppX/*.msix

